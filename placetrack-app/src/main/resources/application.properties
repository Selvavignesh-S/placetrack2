spring.application.name=placetrack-app
server.port=8080

# H2 database stored in the file ./data/placetrack (delete the data folder to reset)
spring.datasource.url=jdbc:h2:file:./data/placetrack
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate creates and updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print the SQL that Hibernate runs (useful for learning and the viva)
spring.jpa.show-sql=true

# Where the eligibility microservice runs
eligibility.url=http://localhost:8081

# Keep the session id in a cookie only, never in URLs (;jsessionid=... leaks it)
server.servlet.session.tracking-modes=cookie
