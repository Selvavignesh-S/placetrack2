<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Login page (AuthController.loginForm). The form posts email + password to /login. -->
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container auth-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <div class="card-body">
            <h1 class="h3 mb-1">Welcome back</h1>
            <p class="auth-subtitle">Log in to PlaceTrack, the campus placement tracker.</p>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <button class="btn btn-primary w-100 py-2">Log in</button>
            </form>

            <p class="mt-3 mb-0 text-center">New student? <a th:href="@{/register}">Create an account</a></p>
        </div>
    </div>

    <!-- Demo accounts from DataSeeder -->
    <div class="alert alert-secondary small mt-3">
        Demo accounts (password <code>Pass@123</code>):<br>
        Coordinator: <code>coord1@placetrack.edu</code><br>
        Students: <code>student1@placetrack.edu</code> … <code>student6@placetrack.edu</code>
    </div>
</main>
</body>
</html>
