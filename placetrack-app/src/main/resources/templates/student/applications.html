<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My applications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">My applications</h1>

    <table class="table table-striped align-middle">
        <thead>
        <tr><th>Company</th><th>Role</th><th>Applied on</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${applications}">
            <td th:text="${a.drive.company.name}">Nimbus Cloud</td>
            <td th:text="${a.drive.roleTitle}">Cloud Engineer</td>
            <td th:text="${#temporals.format(a.appliedAt, 'dd MMM yyyy, HH:mm')}">17 Oct 2026, 20:15</td>
            <td><th:block th:replace="~{fragments/layout :: statusBadge(${a.status})}"></th:block></td>
            <td class="text-end">
                <form method="post" th:action="@{/student/applications/{id}/withdraw(id=${a.id})}"
                      th:if="${a.status.name() == 'APPLIED' or a.status.name() == 'SHORTLISTED'}">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Withdraw this application?')">Withdraw</button>
                </form>
            </td>
        </tr>
        <tr th:if="${applications.isEmpty()}"><td colspan="5">You have not applied to any drive yet.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
