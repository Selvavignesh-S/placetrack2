<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Shared page parts. Use them with th:replace, for example th:replace="~{fragments/layout :: nav}" -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | PlaceTrack'">PlaceTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- session.user is the SessionUser stored at login; the links depend on the role -->
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">PlaceTrack</a>
        <ul class="navbar-nav me-auto" th:if="${session.user != null}">
            <th:block th:if="${session.user.student}">
                <li class="nav-item"><a class="nav-link" th:href="@{/student/drives}">Drives</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/student/applications}">My applications</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/student/profile}">Profile</a></li>
            </th:block>
            <th:block th:unless="${session.user.student}">
                <li class="nav-item"><a class="nav-link" th:href="@{/coordinator/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/coordinator/companies}">Companies</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/coordinator/drives}">Drives</a></li>
            </th:block>
        </ul>
        <div class="d-flex align-items-center" th:if="${session.user != null}">
            <span class="navbar-text me-3" th:text="${session.user.name()}">Name</span>
            <form method="post" th:action="@{/logout}">
                <button class="btn btn-sm btn-outline-light">Log out</button>
            </form>
        </div>
    </div>
</nav>

<!-- Shows a green "message" or red "error" sent from a controller (model or flash attribute) -->
<div th:fragment="flash">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<!-- Coloured badge for an ApplicationStatus: th:replace="~{fragments/layout :: statusBadge(${a.status})}" -->
<th:block th:fragment="statusBadge(status)" th:switch="${status.name()}">
    <span th:case="'APPLIED'" class="badge text-bg-primary">APPLIED</span>
    <span th:case="'SHORTLISTED'" class="badge text-bg-info">SHORTLISTED</span>
    <span th:case="'SELECTED'" class="badge text-bg-success">SELECTED</span>
    <span th:case="'REJECTED'" class="badge text-bg-danger">REJECTED</span>
    <span th:case="'WITHDRAWN'" class="badge text-bg-secondary">WITHDRAWN</span>
</th:block>

</body>
</html>
